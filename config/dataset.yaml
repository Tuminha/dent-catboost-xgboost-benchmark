file: "data/raw/train.csv"
test_file: "data/raw/test.csv"
sample_submission: "data/raw/sample_submission.csv"

# TODO: open train.csv and set the exact target column name
target: "REPLACE_WITH_TARGET"        # e.g., "dental_visit_12mo"
positive_class: 1                    # or "Yes" depending on the CSV

# TODO: confirm id column name
id_columns: ["id"]                   # adjust if different

# Optional time split (likely not needed here)
datetime_column: ""

# TODO: fill after EDA (categorical columns only)
categoricals: []                     # e.g., ["sex","region","income_bracket","education"]

# Drop any post-hoc or leaky columns (rare in this comp)
drop_leaky: []

test_split:
  kind: "stratified"
  test_size: 0.2

scoring:
  primary: "average_precision"       # PR-AUC
  secondary: "roc_auc"

class_weight: "balanced"             # or leave blank to disable


